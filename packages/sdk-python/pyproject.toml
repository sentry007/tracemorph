[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracemorph"
version = "0.1.0"
description = "Zero-dependency Python client for TraceMorph AI agent time-travel debugging and state forking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Frontier Lab" }
]
keywords = ["ai", "agents", "debugging", "observability", "time-travel", "mcp", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/sentry007/tracemorph"
